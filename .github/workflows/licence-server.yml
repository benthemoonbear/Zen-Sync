name: Deploy licence server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['licence-server/**']

jobs:
  deploy:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Test
        run: npx vitest run licence-server
      - name: Deploy to Cloudflare
        working-directory: licence-server
        run: npx --yes wrangler@4 deploy
      - name: Set the Stripe webhook secret (once you've added it in GitHub)
        if: env.STRIPE_WEBHOOK_SECRET != ''
        working-directory: licence-server
        run: printf '%s' "$STRIPE_WEBHOOK_SECRET" | npx --yes wrangler@4 secret put STRIPE_WEBHOOK_SECRET
