name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

env:
  MAIN_VITE_LICENCE_SERVER_URL: ${{ vars.LICENCE_SERVER_URL }}
  MAIN_VITE_CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux AppImage flatpak --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.flatpak

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Zen Sync ${{ github.ref_name }}
          generate_release_notes: false
          prerelease: true
          files: out/*
          body: |
            **Zen Sync ${{ github.ref_name }}**

            - Buy the full version (£14.99) right inside the app — checkout by Stripe, and it unlocks itself when you've paid.
            - Already bought? Settings → **Unlock** → **I already bought it**, and enter your key. One key works on two computers.
            - Downloads: `.exe` for Windows, `.AppImage` or `.flatpak` for Linux.

            Payments are in Stripe test mode for this pre-release.
