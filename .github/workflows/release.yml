name: Build installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths: ['package.json', '.github/workflows/release.yml']

env:
  MAIN_VITE_LICENCE_SERVER_URL: ${{ vars.LICENCE_SERVER_URL }}
  MAIN_VITE_CHECKOUT_URL: ${{ vars.CHECKOUT_URL }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx electron-builder --linux AppImage flatpak --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.AppImage
            dist/*.flatpak

  release:
    needs: [windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Work out the version tag
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.ver.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Zen Sync ${{ steps.ver.outputs.tag }}
          generate_release_notes: false
          prerelease: false
          files: out/*
          body: |
            **Zen Sync ${{ steps.ver.outputs.tag }}**

            - Buy the full version (£14.99) right inside the app — checkout by Stripe, and it unlocks itself when you've paid.
            - Already bought? Settings → **Unlock** → **I already bought it**, and enter your key. One key works on two computers.
            - Downloads: `.exe` for Windows, `.AppImage` or `.flatpak` for Linux.


